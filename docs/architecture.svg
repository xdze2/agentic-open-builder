<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1110 420" width="1110" height="420" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title>Agentic Open Builder: user, front, backend and Claude Code agent</title>
  <style>
    .bg { fill: #ffffff; }
    .grp { fill: #f4f6f9; stroke: #c9d1db; }
    .box { fill: #ffffff; stroke: #5b6b7d; stroke-width: 1.3; }
    .actor { fill: #e8f1fb; stroke: #1f6feb; stroke-width: 1.5; }
    .agent { fill: #fbeee6; stroke: #c4622d; stroke-width: 1.5; }
    .t { fill: #1a1d22; font-size: 14px; font-weight: 600; }
    .s { fill: #5b6470; font-size: 11.5px; }
    .g { fill: #5b6470; font-size: 12px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; }
    .l { fill: #3c4552; font-size: 11.5px; paint-order: stroke; stroke: #ffffff; stroke-width: 4px; stroke-linejoin: round; }
    .a { fill: none; stroke: #6b7684; stroke-width: 1.4; }
    .ah { fill: #6b7684; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #0d1117; }
      .grp { fill: #161b22; stroke: #30363d; }
      .box { fill: #0d1117; stroke: #8b98a8; }
      .actor { fill: #0f2340; stroke: #4c8ff5; }
      .agent { fill: #3a2116; stroke: #e0844f; }
      .t { fill: #e6edf3; }
      .s, .g { fill: #9aa5b1; }
      .l { fill: #c9d1d9; stroke: #0d1117; }
      .a { stroke: #8b98a8; }
      .ah { fill: #8b98a8; }
    }
  </style>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path class="ah" d="M0,0 L10,5 L0,10 z"/>
    </marker>
  </defs>

  <rect class="bg" width="1110" height="420" rx="10"/>

  <!-- groups -->
  <rect class="grp" x="160" y="50" width="240" height="350" rx="10"/>
  <text class="g" x="176" y="74">Front · browser</text>
  <rect class="grp" x="450" y="50" width="420" height="350" rx="10"/>
  <text class="g" x="466" y="74">Backend · Node</text>

  <!-- user -->
  <rect class="actor" x="20" y="195" width="110" height="50" rx="25"/>
  <text class="t" x="75" y="225" text-anchor="middle">User</text>

  <!-- front -->
  <rect class="box" x="180" y="100" width="200" height="70" rx="8"/>
  <text class="t" x="280" y="130" text-anchor="middle">3D viewer</text>
  <text class="s" x="280" y="149" text-anchor="middle">parts, structure, joints, BOM</text>

  <rect class="box" x="180" y="280" width="200" height="70" rx="8"/>
  <text class="t" x="280" y="310" text-anchor="middle">Prompt editor</text>
  <text class="s" x="280" y="329" text-anchor="middle">chips, screenshots, drawings</text>

  <!-- backend -->
  <rect class="box" x="470" y="185" width="160" height="70" rx="8"/>
  <text class="t" x="550" y="215" text-anchor="middle">Vite dev server</text>
  <text class="s" x="550" y="234" text-anchor="middle">/api/shot, /api/prompt</text>

  <path class="box" d="M700,187 v76 a75,12 0 0 0 150,0 v-76 a75,12 0 0 0 -150,0 a75,12 0 0 0 150,0"/>
  <text class="t" x="775" y="225" text-anchor="middle">user_data/</text>
  <text class="s" x="775" y="244" text-anchor="middle">assemblies, library, prompts</text>

  <rect class="box" x="700" y="310" width="150" height="60" rx="8"/>
  <text class="t" x="775" y="336" text-anchor="middle">tools/</text>
  <text class="s" x="775" y="355" text-anchor="middle">solve.mjs, snap.mjs</text>

  <!-- agent -->
  <rect class="agent" x="960" y="80" width="130" height="60" rx="8"/>
  <text class="t" x="1025" y="106" text-anchor="middle">Claude Code</text>
  <text class="s" x="1025" y="124" text-anchor="middle">agent</text>

  <!-- arrows -->
  <path class="a" marker-end="url(#arr)" d="M130,210 L180,150"/>
  <text class="l" x="140" y="168" text-anchor="end">looks, clicks</text>

  <path class="a" marker-end="url(#arr)" d="M280,170 L280,280"/>
  <text class="l" x="288" y="229">picked parts</text>

  <path class="a" marker-end="url(#arr)" d="M380,318 L470,245"/>
  <text class="l" x="432" y="300">Send</text>

  <path class="a" marker-end="url(#arr)" d="M470,198 L380,142"/>
  <text class="l" x="428" y="160" text-anchor="middle">serves models</text>

  <path class="a" marker-end="url(#arr)" d="M630,207 L700,207"/>
  <text class="l" x="665" y="199" text-anchor="middle">saves</text>
  <path class="a" marker-end="url(#arr)" d="M700,235 L630,235"/>
  <text class="l" x="665" y="252" text-anchor="middle">live reload</text>

  <path class="a" marker-end="url(#arr)" d="M775,310 L775,277"/>
  <text class="l" x="783" y="298">reads</text>

  <path class="a" marker-end="url(#arr)" d="M960,108 L840,180"/>
  <text class="l" x="950" y="166" text-anchor="end">reads prompt,</text>
  <text class="l" x="950" y="180" text-anchor="end">edits JSON</text>

  <path class="a" marker-end="url(#arr)" d="M1025,140 L850,340"/>
  <text class="l" x="950" y="255">runs solver,</text>
  <text class="l" x="950" y="269">snapshots</text>

  <path class="a" marker-end="url(#arr)" d="M75,195 V36 H1025 V80"/>
  <text class="l" x="560" y="27" text-anchor="middle">pastes “Read …/prompt.md”</text>
</svg>
